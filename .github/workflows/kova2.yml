name: kova2-native

# 네이티브(Rust) 재작성 전용 검사. 기존 ci.yml(파이썬)과 분리되어 있고 릴리즈·배포는 하지 않는다.
on:
  push:
    paths: ["kova2/**", ".github/workflows/kova2.yml"]
  pull_request:
    paths: ["kova2/**", ".github/workflows/kova2.yml"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kova2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kova2/target
          key: kova2-${{ hashFiles('kova2/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: PowerShell Syntax Check
        shell: pwsh
        run: |
          $scripts = @(
            "installer/make_pe.ps1",
            "installer/make_update.ps1",
            "installer/make_checksums.ps1"
          )
          foreach ($rel in $scripts) {
            if (-not (Test-Path $rel)) { throw "Missing script: $rel" }
            $full = (Resolve-Path $rel).Path
            $text = [IO.File]::ReadAllText($full, [Text.UTF8Encoding]::new($false))
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($text, $full, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($e in $errors) {
                Write-Error ("{0}:{1}: {2}" -f $rel, $e.Extent.StartLineNumber, $e.Message)
              }
              throw "PowerShell syntax check failed for $rel"
            }
            Write-Host "OK: $rel"
          }
      - name: Test
        run: cargo test --workspace --locked
      - name: E2E Commercial Integration Tests
        run: cargo test -p kova-service --test e2e_commercial --locked -- --nocapture
